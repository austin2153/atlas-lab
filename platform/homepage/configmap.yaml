apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Atlas Lab
    theme: dark
    color: slate
    headerStyle: boxed
    background:
      image: https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1920&q=80
      blur: sm
      brightness: 30
      opacity: 50
      saturate: 50
    cardBlur: md
    iconSize: xl
    layout:
      Atlas Lab:
        columns: 2
        style: row


  services.yaml: |
    - Atlas Lab:
        - Proxmox:
            href: https://proxmox.atlas.local:8006
            description: Hypervisor (Proxmox VE 9.2)
            icon: proxmox.png

            widget:
              type: proxmox
              url: https://proxmox.atlas.local:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - Pi-hole:
            href: http://atlas-pihole.atlas.local/admin
            description: DNS and ad blocking
            icon: pi-hole.png

            widget:
              type: pihole
              url: http://atlas-pihole.atlas.local
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
              fields: ["queries", "blocked", "blocked_percent", "gravity"]

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: cluster
