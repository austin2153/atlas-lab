apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Atlas Lab
    theme: dark
    color: blue
    headerStyle: boxed
    cardBlur: md
    iconSize: lg
    statusStyle: dot

  services.yaml: |
    - Lab:
        - Proxmox:
            href: https://proxmox.atlas.local:8006
            description: Hypervisor (Proxmox VE 9.2)
            icon: proxmox.png
            ping: https://proxmox.atlas.local:8006
            widget:
              type: proxmox
              url: https://proxmox.atlas.local:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - Pi-hole:
            href: http://atlas-pihole.atlas.local/admin
            description: DNS and ad blocking
            icon: pi-hole.png
            ping: http://atlas-pihole.atlas.local
            widget:
              type: pihole
              url: http://atlas-pihole.atlas.local
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
              fields: ["queries", "blocked", "blocked_percent", "gravity"]

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: cluster
